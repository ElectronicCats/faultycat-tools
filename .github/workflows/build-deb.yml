name: Build Debian Package

on:
  push:
    branches:
      - main
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload assets to (ex: v3.0.0.5)'
        required: true
        default: 'v3.0.0.5'

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract Package Version
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            VERSION="latest"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller faultycmd.spec

      - name: Prepare Packaging Environment
        run: |
          BUILD_DIR="build_deb"

          # 1. Create base directory and copy Debian metadata
          mkdir -p "$BUILD_DIR"
          cp -a packaging/debian/* "$BUILD_DIR/"

          # 2. Install the PyInstaller onedir build
          INSTALL_DIR="${BUILD_DIR}/usr/lib/faultycmd"
          mkdir -p "$INSTALL_DIR"
          cp -r dist/faultycmd/* "$INSTALL_DIR/"

          # 3. Symlink the binary into /usr/bin
          mkdir -p "${BUILD_DIR}/usr/bin"
          ln -sf /usr/lib/faultycmd/faultycmd "${BUILD_DIR}/usr/bin/faultycmd"

          # 4. Ensure correct permissions for Debian
          find "$BUILD_DIR/DEBIAN" -type f -exec chmod 644 {} \;
          [ -f "$BUILD_DIR/DEBIAN/postinst" ] && chmod 755 "$BUILD_DIR/DEBIAN/postinst"
          chmod 755 "$INSTALL_DIR/faultycmd"

          # 5. Pin the version into DEBIAN/control
          sed -i "s/^Version: .*/Version: ${{ env.VERSION }}/" "$BUILD_DIR/DEBIAN/control"

      - name: Build .deb Package
        run: |
          dpkg-deb --build --root-owner-group build_deb/ "faultycmd-${{ env.VERSION }}.deb"

      - name: Upload Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: faultycmd-debian-package
          path: "*.deb"
          retention-days: 30

      - name: Upload to GitHub Releases (Only Releases)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: "faultycmd-${{ env.VERSION }}.deb"
