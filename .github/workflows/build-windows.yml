name: Build Windows Installer

on:
  push:
    branches:
      - main
      - i2c_scanner
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload assets to (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Log Commit Being Built
      run: |
        Write-Host "Building commit: $(git rev-parse HEAD)"
        Write-Host "Branch/ref: ${{ github.ref_name }}"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Extract Package Version
      id: get_version
      run: |
        $version = (Get-Content "VERSION" -Raw).Trim()
        if (-not $version) { $version = "latest" }
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller faultycmd_windows.spec

    - name: Install Inno Setup
      run: |
        choco install innosetup -y

    - name: Pin Installer Version
      run: |
        (Get-Content installer\faultycat_installer.iss) -replace '^AppVersion=.*', "AppVersion=${{ steps.get_version.outputs.version }}" | Set-Content installer\faultycat_installer.iss

    - name: Create Installer
      run: |
        if (!(Test-Path -Path dist)) { mkdir dist }
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\faultycat_installer.iss

    - name: Rename Installer
      run: |
        Copy-Item dist/FaultyCat-Setup.exe "dist/faultycmd-${{ steps.get_version.outputs.version }}.exe"

    - name: Upload Action Artifact
      uses: actions/upload-artifact@v4
      with:
        name: faultycmd-windows-${{ steps.get_version.outputs.version }}
        path: dist/faultycmd-${{ steps.get_version.outputs.version }}.exe

    - name: Upload to GitHub Releases (Only Releases)
      if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        files: dist/faultycmd-${{ steps.get_version.outputs.version }}.exe
