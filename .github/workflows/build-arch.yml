name: Build Arch Linux Package

on:
  push:
    branches:
      - main
      - i2c_scanner
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload assets to (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git python python-pip sudo

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Package Version
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            VERSION="latest"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Install Python build dependencies
        run: |
          python -m pip install --break-system-packages --upgrade pip
          python -m pip install --break-system-packages -e .
          python -m pip install --break-system-packages pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller faultycmd.spec

      - name: Prepare Packaging Environment
        run: |
          BUILD_DIR="build_arch"

          # 1. Install the PyInstaller onedir build
          INSTALL_DIR="${BUILD_DIR}/usr/lib/faultycmd"
          mkdir -p "$INSTALL_DIR"
          cp -r dist/faultycmd/* "$INSTALL_DIR/"

          # 2. Symlink the binary into /usr/bin
          mkdir -p "${BUILD_DIR}/usr/bin"
          ln -sf /usr/lib/faultycmd/faultycmd "${BUILD_DIR}/usr/bin/faultycmd"
          chmod 755 "$INSTALL_DIR/faultycmd"

          # 3. Install udev rules
          mkdir -p "${BUILD_DIR}/usr/lib/udev/rules.d"
          cp packaging/debian/lib/udev/rules.d/99-faultycat.rules \
            "${BUILD_DIR}/usr/lib/udev/rules.d/99-faultycat.rules"

          # 4. Install desktop entry
          mkdir -p "${BUILD_DIR}/usr/share/applications"
          cp packaging/debian/usr/share/applications/faultycmd.desktop \
            "${BUILD_DIR}/usr/share/applications/faultycmd.desktop"

      - name: Create PKGBUILD
        run: |
          cat > build_arch/PKGBUILD << EOF
          pkgname=faultycmd
          pkgver=${{ env.VERSION }}
          pkgrel=1
          pkgdesc="Host CLI/TUI for FaultyCat v3 fault-injection board"
          arch=('x86_64')
          url="https://github.com/ElectronicCats/faultycat"
          license=('BSD-3-Clause')
          depends=('glibc')
          options=('!debug' '!strip')

          package() {
            cp -r "\$srcdir"/../usr "\$pkgdir/"
          }
          EOF

      - name: Build .pkg.tar.zst Package
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder build_arch/
          cd build_arch && sudo -u builder makepkg -f --noconfirm

      - name: Move Package to Root
        run: |
          PKG_FILE=$(find build_arch -name "faultycmd-*.pkg.tar.zst" ! -name "*-debug-*.pkg.tar.zst" | head -n 1)
          if [ -z "$PKG_FILE" ]; then
            echo "Error: Package file not found!"
            exit 1
          fi
          mv "$PKG_FILE" "faultycmd-${{ env.VERSION }}.pkg.tar.zst"

      - name: Upload Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: faultycmd-arch-package
          path: "*.pkg.tar.zst"
          retention-days: 30

      - name: Upload to GitHub Releases (Only Releases)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: "faultycmd-${{ env.VERSION }}.pkg.tar.zst"
